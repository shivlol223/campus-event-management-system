{% extends "base.html" %}
{% block content %}
<h1>Register for {{ event.name }}</h1>
<div class="card" style="max-width: 500px;">
    <p><strong>Venue:</strong> {{ event.venue }}</p>
    <p><strong>Date:</strong> {{ event.event_date }}</p>
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Student Full Name:</label><br>
            <input type="text" name="student_name" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Student Email Address:</label><br>
            <input type="email" name="student_email" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <button type="submit" class="btn">Confirm Registration</button>
    </form>
</div>
{% endblock %}
